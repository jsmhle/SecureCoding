<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>딥페이크 탐지</title>
  <style>
    body {
      font-family: 'Arial';
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      background: #f4f4f4;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    label {
      font-weight: bold;
    }
    .result {
      margin-top: 20px;
      padding: 10px;
      background: #fff;
      border-radius: 8px;
      box-shadow: inset 0 0 5px #aaa;
    }
    img {
      display: block;
      margin: 15px auto;
      border-radius: 8px;
      max-width: 100%;
      height: auto;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      border-radius: 5px;
    }
    select, input[type=file] {
      width: 100%;
      margin: 10px 0;
      padding: 5px;
    }
  </style>
</head>
<body>
  <h2>딥페이크 탐지기</h2>
  <form method="POST" enctype="multipart/form-data">
    <label>모델 선택:</label>
    <select name="model_type" required>
      <option value="b1" {% if model == 'B1' %}selected{% endif %}>EfficientNet-B1</option>
      <option value="v2s" {% if model == 'V2S' %}selected{% endif %}>EfficientNet-V2S</option>
      <option value="ensemble" {% if model == 'ENSEMBLE' %}selected{% endif %}>EfficientNetV2S + ViT + GCN (Ensemble)</option>
    </select>

    <label>이미지 업로드:</label>
    <input type="file" name="image" required>
    {% if filename %}
      <input type="hidden" name="filename" value="{{ filename }}">
    {% endif %}

    <button type="submit">탐지하기</button>
  </form>

  {% if result %}
  <div class="result">
    <h3>결과: {{ result }} (정확도: {{ confidence }})</h3>
    <p>사용 모델: {{ model }}</p>
    <img src="{{ url_for('static', filename='uploads/' ~ filename) }}">
  </div>
  {% endif %}

  {% if gemini_opinion %}
  <div class="result">
    <h3>Gemini AI 의견:</h3>
    <p>{{ gemini_opinion }}</p>
  </div>
  {% endif %}
</body>
</html>
